version: '2.4'

services:
  pdf-merger-user1:
    restart: always
    container_name: pdf-merger-user1
    image: ghcr.io/hopeman876/pdf-duplex-merger:latest
    # Benutzer-ID:Gruppen-ID, unter der der Container laeuft. Muss in den
    # eingebundenen Ordnern lesen, schreiben und loeschen duerfen.
    # Auf dem NAS per SSH mit "id <benutzername>" ermitteln.
    user: "1026:100"
    volumes:
      - "/volume1/Scanner/user1/Doppelseitig:/input"
      - "/volume1/Scanner/user1/OCR_machen:/output"
    environment:
      - SOURCE_DIRECTORY=/input
      - DESTINATION_DIRECTORY=/output
      - DELETE_OLD_FILES=True
      - CHECK_INTERVAL=10
    # Haertung: kein Netzwerk, schreibgeschuetztes Dateisystem, keine
    # Sonderrechte und begrenzte Ressourcen
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 50

  pdf-merger-user2:
    restart: always
    container_name: pdf-merger-user2
    image: ghcr.io/hopeman876/pdf-duplex-merger:latest
    # Benutzer-ID:Gruppen-ID, unter der der Container laeuft. Muss in den
    # eingebundenen Ordnern lesen, schreiben und loeschen duerfen.
    # Auf dem NAS per SSH mit "id <benutzername>" ermitteln.
    user: "1026:100"
    volumes:
      - "/volume1/Scanner/user2/Doppelseitig:/input"
      - "/volume1/Scanner/user2/OCR_machen:/output"
    environment:
      - SOURCE_DIRECTORY=/input
      - DESTINATION_DIRECTORY=/output
      - DELETE_OLD_FILES=True
      - CHECK_INTERVAL=10
    # Haertung: kein Netzwerk, schreibgeschuetztes Dateisystem, keine
    # Sonderrechte und begrenzte Ressourcen
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 50
